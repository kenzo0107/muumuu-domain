[tools]
go = "1.26"
golangci-lint = "2.12.2"

[tasks.fmt]
description = "Format code"
run = "go fmt ./..."

[tasks.test]
description = "Execute unit tests"
run = "go test -v -count=1 -timeout 300s -race -cover ./..."

[tasks."test-live"]
description = "Execute tests against the real API (sandbox by default; requires MUUMUU_DOMAIN_TOKEN)"
run = "go test -tags live -v -count=1 -timeout 300s -run '^TestLive' ."

[tasks.cov]
description = "Output coverage of testing"
run = """
go test -count=1 -coverprofile=cover.out ./...
go tool cover -html=cover.out
"""

[tasks.lint]
description = "Lint"
run = "golangci-lint run --build-tags live"

[tasks."pr-prep"]
description = "Execute this command before you create a pull request"
depends = ["fmt", "lint", "test"]
